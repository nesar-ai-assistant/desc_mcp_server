# The container image that carries this server's environment (built by scripts/image.sh
# from conda-lock-image.yml next to this file). Ships inside the dispatch pack as
# env/image.yml so an engine with a container carrier can run the kernels in it instead of
# building the lock env on the node; engines without one ignore it (the lock still travels).
#
# tag = first 12 hex of sha1(conda-lock-image.yml) + "-u24" (base ubuntu 24.04, glibc 2.39:
# Polaris cray-mpich-abi needs GLIBC_2.38) + "-cpu"; the test suite checks it.
# digest is filled in after a push (docker buildx imagetools inspect); empty = unpublished.
ref: ghcr.io/nesar/desc-mcp
tag: f4497551acdf-u24-cpu
digest: sha256:cfd7ed0b4d36a7fe57197a86a7c61ebe1291782e4cc20177b05a3f7fd1c53f49
lock: conda-lock-image.yml
platforms: [linux/amd64]
mpi: mpich-abi
base: ubuntu:24.04
glibc: "2.39"
# per-facility launch hints (what the image needs from the host; the engine owns the commands)
perlmutter: {runtime: podman-hpc, flags: ["--mpi", "--entrypoint=", "--userns keep-id", "--group-add keep-groups"]}
polaris: {runtime: apptainer, modules: ["cray-mpich-abi"], binds: ["/opt", "/var/run/palsd/"], ld_library_path: "$CRAY_LD_LIBRARY_PATH:$LD_LIBRARY_PATH:/opt/cray/pe/pals/1.2.12/lib"}
